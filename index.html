<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>私のホームページ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>

  <div id="app"></div>

  <script>
    window.$docsify = {
      name: '私のホームページ',
      loadSidebar: true,
      subMaxLevel: 2,
      copyCode: {
        buttonText: 'コピー',
        successText: 'コピーしました',
        errorText: 'コピーできませんでした'
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3/dist/docsify-copy-code.min.js"></script>

</body>
</html>
